services:
  postgres:
    image: postgres:17
    container_name: asset-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - asset_pgdata:/var/lib/postgresql/data

volumes:
  asset_pgdata:
